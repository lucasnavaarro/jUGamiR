# Docker Compose >= 2.24.4. The administrator terminates HTTPS on this same host.
# Do not combine this overlay with docker-compose.production.yml.
services:
    db:
        ports: !reset []
    pgadmin:
        profiles: [admin]
        ports: !reset []
    backend:
        ports: !reset []
        environment:
            SPRING_PROFILES_ACTIVE: production
            APP_URL: ${APP_URL:?Set APP_URL to the final public HTTPS origin}
        read_only: true
        tmpfs:
            - /tmp:size=256m,mode=1777
    frontend:
        ports: !override
            - "127.0.0.1:${APP_HTTP_PORT:-3000}:80"
        environment:
            NGINX_ENVSUBST_FILTER: ^TRUSTED_PROXY_IP$
            # Empty means the container's default gateway (the Docker host).
            TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-}
        volumes:
            - ./frontend/nginx.managed-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
            - ./frontend/14-trusted-proxy.envsh:/docker-entrypoint.d/14-trusted-proxy.envsh:ro
