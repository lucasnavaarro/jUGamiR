resolver 127.0.0.11 valid=5s ipv6=off;
# HTTP only on the host loopback; public TLS is handled by the administrator.
set_real_ip_from 127.0.0.1;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    set $backend_url http://managedbackend:8080;
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 202m;

    # The only public entry point is HTTPS, even though the host hop is HTTP.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /imagenes/ {
        proxy_pass $backend_url;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location = /actuator/health {
        proxy_pass $backend_url;
    }
    location = /api/auth/me {
        proxy_pass $backend_url;
    }
    location /api/auth/ {
        limit_req zone=auth_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_url;
    }
    location /api/ {
        proxy_pass $backend_url;
    }
    location /ws {
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        # Nginx inherits proxy_set_header only if none exist in this location.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
    }
}
