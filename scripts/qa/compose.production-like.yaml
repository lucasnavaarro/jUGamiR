# Isolated QA overlay: runs the real managed-proxy template and entrypoint,
# with the same read-only filesystem and /tmp budget as production.
services:
  managedbackend:
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    environment:
      APP_DEADLINES_ENABLED: "true"
    networks:
      default: {}
      productionlike:
        aliases: [backend]
  managedfrontend:
    volumes: !override
      - ../../frontend/nginx.managed-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../frontend/14-trusted-proxy.envsh:/docker-entrypoint.d/14-trusted-proxy.envsh:ro
    environment:
      NGINX_ENVSUBST_FILTER: ^TRUSTED_PROXY_IP$
      TRUSTED_PROXY_IP: ${QA_EDGE_IP:-}
    networks: [productionlike]
  managededge:
    networks: [productionlike]
networks:
  productionlike:
    driver: bridge
