# Isolated acceptance environment. Never combines with the application Compose files.
name: jugamir-fullqa-20261104
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audit_test
      POSTGRES_PASSWORD: disposable-qa-only
      POSTGRES_DB: audit_test
    volumes:
      - qa_db:/var/lib/postgresql/data
      - ../../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U audit_test -d audit_test"]
      interval: 2s
      timeout: 2s
      retries: 60
    mem_limit: 768m
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:18025:8025"]
    mem_limit: 256m
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: jugamir-fullqa-backend:20261104
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: audit_test
      DB_USER: audit_test
      DB_PASSWORD: disposable-qa-only
      JWT_SECRET: disposable-qa-key-not-for-production-64-characters-long-01234567890
      APP_URL: https://localhost:18443
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: production
      SPRING_MAIL_HOST: mail
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: qa@example.invalid
      SPRING_MAIL_PASSWORD: unused
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      MAIL_USERNAME: qa@example.invalid
      MAIL_PASSWORD: unused
      SCRIPTS_PATH: /app/db
      IMAGENES_PATH: /app/static
      JAVA_TOOL_OPTIONS: -Xmx512m
    ports: ["127.0.0.1:18081:8080"]
    volumes: [qa_images:/app/static]
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
    mem_limit: 1g
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    image: jugamir-fullqa-frontend:20261104
    ports: ["127.0.0.1:18080:80", "127.0.0.1:18443:443"]
    volumes:
      - ../../frontend/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - /private/tmp/jugamir-fullqa-tls:/etc/nginx/tls:ro
    depends_on: [backend]
    mem_limit: 256m
  loadbackend:
    extends:
      service: backend
    environment:
      DB_NAME: audit_load
    ports: !override ["127.0.0.1:18082:8080"]
    volumes: !override [qa_load_images:/app/static]
    profiles: [load]
  restorebackend:
    extends:
      service: backend
    environment:
      DB_NAME: audit_restore
    ports: !override ["127.0.0.1:18083:8080"]
    volumes: !override [qa_restore_images:/app/static]
    profiles: [restore]
  historicalbackend:
    extends:
      service: backend
    environment:
      DB_NAME: audit_historical
    ports: !override ["127.0.0.1:18086:8080"]
    volumes: !override [qa_historical_images:/app/static]
    profiles: [historical]
  readerbackend:
    extends:
      service: backend
    environment:
      APP_URL: http://localhost:18084
      APP_DEADLINES_ENABLED: "false"
    ports: !override ["127.0.0.1:18085:8080"]
    profiles: [reader]
  readerfrontend:
    image: jugamir-fullqa-frontend:20261104
    ports: ["127.0.0.1:18084:80"]
    volumes: ["./nginx-reader.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [readerbackend]
    profiles: [reader]
  managedbackend:
    extends:
      service: backend
    environment:
      APP_URL: https://localhost:18444
      APP_DEADLINES_ENABLED: "false"
    ports: !override ["127.0.0.1:18089:8080"]
    profiles: [managed]
  replacementbackend:
    extends:
      service: backend
    ports: !override ["127.0.0.1:18091:8080"]
    networks:
      default:
        aliases: [backend]
    profiles: [replacement]
  managedfrontend:
    image: jugamir-fullqa-frontend:20261104
    volumes: ["./nginx-managed-qa.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [managedbackend]
    restart: on-failure:3
    profiles: [managed]
  managededge:
    image: nginx:alpine
    ports: ["127.0.0.1:18444:443"]
    volumes:
      - ./nginx-managed-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - /private/tmp/jugamir-fullqa-tls:/etc/nginx/tls:ro
    profiles: [managed]
    depends_on: [managedfrontend]
    restart: on-failure:3
volumes:
  qa_db:
  qa_images:
  qa_load_images:
  qa_restore_images:
  qa_historical_images:
networks:
  default:
    driver: bridge
