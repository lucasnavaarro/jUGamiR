# Requires Docker Compose >= 2.24.4. Supply APP_URL=https://your-domain and TLS_CERTS_DIR.
services:
    db:
        ports: !reset []
    pgadmin:
        profiles: [admin]
        ports: !reset []
    backend:
        ports: !reset []
        environment:
            SPRING_PROFILES_ACTIVE: production
            APP_URL: ${APP_URL:?Set APP_URL to your HTTPS origin}
        read_only: true
        tmpfs:
            - /tmp:size=256m,mode=1777
    frontend:
        ports: !override
            - "80:80"
            - "443:443"
        volumes:
            - ./frontend/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
            - ${TLS_CERTS_DIR:?Set TLS_CERTS_DIR to the certificate directory}:/etc/nginx/tls:ro
